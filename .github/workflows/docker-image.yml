# Builds docker/Dockerfile and pushes it to Docker Hub as <DOCKERHUB_USERNAME>/modded-nanogpt-prof.
# Runs on every push to the `profiling` branch (and manually via "Run workflow").
# Required repo secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (a Docker Hub personal access token).
name: docker-image

on:
  push:
    branches: [profiling]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The image is ~15 GB uncompressed; hosted runners only have ~14 GB free on /, so reclaim the
      # preinstalled toolchains and put docker's data dir on the merged LVM volume.
      - name: Maximize build space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 2048
          temp-reserve-mb: 1024
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'
          build-mount-path: /var/lib/docker
      - name: Restart docker on the enlarged volume
        run: sudo service docker restart && df -h /var/lib/docker

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/modded-nanogpt-prof:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/modded-nanogpt-prof:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
